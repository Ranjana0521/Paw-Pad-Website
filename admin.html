<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pawpad Management Suite — Admin Control</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="assets/fonts/BostonAngel.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/OpenSans.woff2" as="font" type="font/woff2" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/styles.css" />

  <style>
    @font-face {
      font-family: "Boston Angel";
      src: url("assets/fonts/BostonAngel.woff2") format("woff2"),
           url("assets/fonts/BostonAngel.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Open Sans";
      src: url("assets/fonts/OpenSans.woff2") format("woff2"),
           url("assets/fonts/OpenSans.ttf") format("truetype-variations");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Live website brand palette */
      --admin-bg: #fbfbf8;
      --admin-sidebar: #f6f3eb;
      --admin-card: #ffffff;
      --admin-card-hover: #faf7f0;
      --admin-card-subtle: #f7eee1;
      --admin-border: #e7decb;
      --admin-border-subtle: #efe8dc;
      --admin-text: #2e2e2e;
      --admin-text-muted: #5e574c;
      --admin-text-faint: #8d8577;
      --admin-gold: #b18d4e;
      --admin-gold-light: #8e6f3b;
      --admin-gold-glow: rgba(177, 141, 78, 0.2);
      --admin-champagne: #f4e2c8;
      --admin-champagne-soft: #f7eee1;
      --admin-champagne-deep: #efd5b3;
      --admin-eagle: #b8bea9;
      --admin-eagle-deep: #9aa28b;
      --admin-success: #166534;
      --admin-success-bg: #dcfce7;
      --admin-warning: #92400e;
      --admin-warning-bg: #fef3c7;
      --admin-danger: #991b1b;
      --admin-danger-bg: #fee2e2;
      --admin-info: #1e40af;
      --admin-info-bg: #dbeafe;
      --admin-danger-card-bg: #fff8f8;
      --admin-danger-card-border: #fecaca;
      --admin-banner-bg: linear-gradient(135deg, #f7eee1 0%, #f4e2c8 100%);
      --admin-banner-border: #e2cfb7;
      --admin-banner-title: #2e2e2e;
      --admin-banner-text: #5e574c;
      --admin-user-capsule-bg: #eee8dc;
      --admin-user-capsule-border: #dfd6c4;
      --admin-subcard-bg: #faf8f4;
      --admin-subcard-border: #e7decb;
      --admin-thead-bg: #f6f3eb;
      --admin-tr-hover: rgba(177, 141, 78, 0.05);
      --font-display: "Boston Angel", "Fraunces", Georgia, serif;
      --font-sans: "Open Sans", system-ui, -apple-system, sans-serif;
    }

    /* Dark Mode Palette matching live site brand dark theme */
    [data-theme="dark"] {
      --admin-bg: #1d1c19;
      --admin-sidebar: #24221e;
      --admin-card: #2e2c27;
      --admin-card-hover: #34322c;
      --admin-card-subtle: #38352f;
      --admin-border: #423e35;
      --admin-border-subtle: #34322c;
      --admin-text: #f5ecdc;
      --admin-text-muted: #ded4be;
      --admin-text-faint: #a6a08f;
      --admin-gold: #c9a86a;
      --admin-gold-light: #e6c98f;
      --admin-gold-glow: rgba(201, 168, 106, 0.25);
      --admin-champagne: #3f3b33;
      --admin-champagne-soft: #34322c;
      --admin-champagne-deep: #4e493e;
      --admin-eagle: #9aa28b;
      --admin-eagle-deep: #545a47;
      --admin-success: #4ade80;
      --admin-success-bg: rgba(74, 222, 128, 0.15);
      --admin-warning: #fbbf24;
      --admin-warning-bg: rgba(251, 191, 36, 0.15);
      --admin-danger: #f87171;
      --admin-danger-bg: rgba(248, 113, 113, 0.15);
      --admin-danger-card-bg: rgba(248, 113, 113, 0.08);
      --admin-danger-card-border: rgba(248, 113, 113, 0.28);
      --admin-info: #60a5fa;
      --admin-info-bg: rgba(96, 165, 250, 0.15);
      --admin-banner-bg: linear-gradient(135deg, #2f2a22 0%, #23201a 100%);
      --admin-banner-border: #4a4233;
      --admin-banner-title: #f5ecdc;
      --admin-banner-text: #ded4be;
      --admin-user-capsule-bg: #2b2721;
      --admin-user-capsule-border: #453e32;
      --admin-subcard-bg: #23201a;
      --admin-subcard-border: #3d372c;
      --admin-thead-bg: #24221e;
      --admin-tr-hover: rgba(201, 168, 106, 0.08);
    }

    [data-theme="dark"] .admin-header {
      background: rgba(29, 28, 25, 0.94);
    }
    [data-theme="dark"] .input-field {
      background: #24221e;
      color: #f5ecdc;
    }
    [data-theme="dark"] .card {
      background: #2e2c27;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    [data-theme="dark"] .modal-card {
      background: #2e2c27;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }
    [data-theme="dark"] .modal-overlay {
      background: rgba(10, 9, 8, 0.75);
    }
    [data-theme="dark"] .btn-admin-primary {
      background: #c9a86a;
      color: #141312;
    }
    [data-theme="dark"] .btn-admin-primary:hover {
      background: #e6c98f;
      color: #141312;
    }
    [data-theme="dark"] .btn-admin-secondary {
      background: #34322c;
      color: #f5ecdc;
      border-color: #423e35;
    }
    [data-theme="dark"] .btn-admin-secondary:hover {
      background: #3f3b33;
      border-color: #c9a86a;
    }

    /* Banner container class */
    .admin-banner {
      background: var(--admin-banner-bg) !important;
      border: 1px solid var(--admin-banner-border) !important;
    }
    .admin-banner h2 {
      color: var(--admin-banner-title) !important;
    }
    .admin-banner p {
      color: var(--admin-banner-text) !important;
    }

    /* Danger Card class */
    .card-danger {
      background: var(--admin-danger-card-bg) !important;
      border: 1px solid var(--admin-danger-card-border) !important;
    }
    .card-danger h3 {
      color: var(--admin-danger) !important;
    }
    .card-danger p {
      color: var(--admin-text-muted) !important;
    }

    /* User Capsule class */
    .admin-user-capsule {
      background: var(--admin-user-capsule-bg) !important;
      border: 1px solid var(--admin-user-capsule-border) !important;
    }

    /* Subcard container class */
    .admin-subcard {
      background: var(--admin-subcard-bg) !important;
      border: 1px solid var(--admin-subcard-border) !important;
    }

    /* Reset and enforce standard native cursors in Admin Panel (overrides frontend custom cursor) */
    *, *::before, *::after {
      cursor: auto;
    }

    html, body {
      cursor: auto !important;
    }

    /* All text input fields, textareas, search, numbers, dates, contenteditable */
    input,
    textarea,
    .input-field,
    [contenteditable],
    [contenteditable="true"],
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="search"],
    input[type="url"],
    input[type="datetime-local"],
    input[type="date"],
    input[type="time"],
    input[type="month"],
    input[type="week"] {
      cursor: text !important;
    }

    /* Interactive controls */
    a,
    button,
    [role="button"],
    select,
    option,
    .btn-admin,
    label,
    summary,
    input[type="button"],
    input[type="submit"],
    input[type="reset"],
    input[type="checkbox"],
    input[type="radio"],
    input[type="file"],
    input[type="range"],
    input[type="color"] {
      cursor: pointer !important;
    }

    /* Disabled elements */
    button:disabled,
    .btn-admin:disabled,
    input:disabled,
    textarea:disabled,
    select:disabled,
    [disabled],
    [aria-disabled="true"] {
      cursor: not-allowed !important;
    }

    @media (pointer: fine) {
      input,
      textarea,
      .input-field,
      [contenteditable],
      [contenteditable="true"],
      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="tel"],
      input[type="number"],
      input[type="search"],
      input[type="url"],
      input[type="datetime-local"],
      input[type="date"],
      input[type="time"],
      input[type="month"],
      input[type="week"] {
        cursor: text !important;
      }

      a,
      button,
      [role="button"],
      select,
      option,
      .btn-admin,
      label,
      summary,
      input[type="button"],
      input[type="submit"],
      input[type="reset"],
      input[type="checkbox"],
      input[type="radio"],
      input[type="file"],
      input[type="range"],
      input[type="color"] {
        cursor: pointer !important;
      }
    }

    .cursor-dot,
    .paw-trail,
    #cursor-dot,
    #paw-trail-container {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    body {
      background-color: var(--admin-bg);
      color: var(--admin-text);
      font-family: var(--font-sans);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--admin-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--admin-border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--admin-gold);
    }

    /* Base Utility Classes */
    .admin-app {
      display: flex;
      min-height: 100vh;
      background: var(--admin-bg);
    }

    .admin-sidebar {
      width: 280px;
      background: var(--admin-sidebar);
      border-right: 1px solid var(--admin-border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      flex-shrink: 0;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: radial-gradient(circle at 90% 10%, rgba(244, 226, 200, 0.3) 0%, transparent 65%);
    }

    .admin-header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(251, 251, 248, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .admin-content {
      padding: 32px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-pending {
      background: var(--admin-warning-bg);
      color: var(--admin-warning);
      border: 1px solid #fcd34d;
    }

    .badge-interview {
      background: var(--admin-info-bg);
      color: var(--admin-info);
      border: 1px solid #93c5fd;
    }

    .badge-approved {
      background: var(--admin-success-bg);
      color: var(--admin-success);
      border: 1px solid #86efac;
    }

    .badge-rejected {
      background: var(--admin-danger-bg);
      color: var(--admin-danger);
      border: 1px solid #fca5a5;
    }

    .badge-enrolled {
      background: var(--admin-champagne);
      color: var(--admin-gold-light);
      border: 1px solid var(--admin-gold);
    }

    .btn-admin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(.2, .7, .2, 1);
      border: 1px solid transparent;
      text-decoration: none;
      font-family: var(--font-sans);
    }

    .btn-admin-primary {
      background: var(--admin-text);
      color: var(--admin-bg);
    }
    .btn-admin-primary:hover {
      background: var(--admin-gold);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--admin-gold-glow);
    }

    .btn-admin-secondary {
      background: var(--admin-card);
      color: var(--admin-text);
      border-color: var(--admin-border);
    }
    .btn-admin-secondary:hover {
      background: var(--admin-card-hover);
      border-color: var(--admin-gold);
      transform: translateY(-1px);
    }

    .btn-admin-gold {
      background: var(--admin-champagne);
      color: var(--admin-text);
      border-color: #e5d4bc;
    }
    .btn-admin-gold:hover {
      background: var(--admin-champagne-deep);
      transform: translateY(-1px);
    }

    .btn-admin-danger {
      background: var(--admin-danger-bg);
      color: var(--admin-danger);
      border-color: #fca5a5;
    }
    .btn-admin-danger:hover {
      background: #ef4444;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-admin-success {
      background: var(--admin-success-bg);
      color: var(--admin-success);
      border-color: #86efac;
    }
    .btn-admin-success:hover {
      background: #16a34a;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      color: var(--admin-text);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      cursor: text !important;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--admin-gold);
      box-shadow: 0 0 0 3px var(--admin-gold-glow);
      cursor: text !important;
    }

    textarea.input-field {
      min-height: 90px;
      resize: vertical;
      cursor: text !important;
    }

    .card {
      background: var(--admin-card);
      color: var(--admin-text);
      border: 1px solid var(--admin-border);
      border-radius: 14px;
      padding: 24px;
      position: relative;
      box-shadow: 0 4px 20px rgba(46, 46, 46, 0.03);
    }

    [data-theme="dark"] .admin-main {
      background: radial-gradient(circle at 90% 10%, rgba(201, 168, 106, 0.06) 0%, transparent 65%);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(46, 42, 37, 0.55);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: adminFadeIn 0.2s ease;
    }

    .modal-card {
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(46, 42, 37, 0.18);
      animation: adminSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes adminFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes adminSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Responsive Mobile Warning / Fallback */
    @media (max-width: 900px) {
      .admin-app {
        flex-direction: column;
      }
      .admin-sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
    }
  </style>
</head>

<body>
  <div id="admin-root"></div>

  <!-- Google Identity Services (OAuth 2.0 / GIS) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- React 18 Production minified -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  
  <!-- CMS and Store Modules -->
  <script src="assets/js/content-store.js"></script>
  <script src="assets/js/applications-store.js"></script>
  
  <!-- Admin Application Entry -->
  <script src="assets/js/admin.js"></script>
</body>

</html>
